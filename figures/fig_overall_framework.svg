   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="14.173228" y="16.208382" transform="rotate(-0 14.173228 16.208382)">统一输入：负荷 / 光伏观测与已发布预报、电价信息</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="14.173228" y="28.89499" transform="rotate(-0 14.173228 28.89499)">按时段起点对齐 · 10 min × 144 段 / 日 · 电量 = 功率 × 1/6 h</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #2a718a" x="12.188976" y="64.836877" transform="rotate(-0 12.188976 64.836877)">Q1  确定性日前调度</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="12.188976" y="84.985974" transform="rotate(-0 12.188976 84.985974)">已知电价、负荷和光伏</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="12.188976" y="98.040969" transform="rotate(-0 12.188976 98.040969)">全天 144 时段线性规划</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="12.188976" y="111.07284" transform="rotate(-0 12.188976 111.07284)">首末储电量均为 6000 kWh</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="12.188976" y="124.11221" transform="rotate(-0 12.188976 124.11221)">输出购电与充放电计划</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="12.188976" y="137.178455" transform="rotate(-0 12.188976 137.178455)">对照：无储能 / 分时贪婪</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #267f89" x="165.259843" y="64.836877" transform="rotate(-0 165.259843 64.836877)">Q2  不确定日前调度</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="165.259843" y="85.001599" transform="rotate(-0 165.259843 85.001599)">XGBoost + 光伏 7 日同刻均值</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="165.259843" y="98.064094" transform="rotate(-0 165.259843 98.064094)">净负荷残差分位 α = 0.8</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="165.259843" y="111.075965" transform="rotate(-0 165.259843 111.075965)">日前 LP；日末 2400 kWh</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="165.259843" y="123.840335" transform="rotate(-0 165.259843 123.840335)">锁定合同；保护回放 ρ = 0.625</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="165.259843" y="137.18658" transform="rotate(-0 165.259843 137.18658)">缺口按 5π 紧急购电</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #3c6594" x="318.330709" y="64.845713" transform="rotate(-0 318.330709 64.845713)">Q3  日内滚动调度</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="318.330709" y="84.989724" transform="rotate(-0 318.330709 84.989724)">负荷预测 + 已发布光伏预报</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="318.330709" y="98.052844" transform="rotate(-0 318.330709 98.052844)">0 / 6 / 12 / 18 点滚动 LP</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="318.330709" y="111.072215" transform="rotate(-0 318.330709 111.072215)">48 h；分源分位 0.60 / 0.50</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="318.330709" y="124.11596" transform="rotate(-0 318.330709 124.11596)">更新剩余合同 + 贪心回放</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="318.330709" y="137.13158" transform="rotate(-0 318.330709 137.13158)">少买退 0.5π；多买付 1.5π</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="12.755906" y="187.310562" transform="rotate(-0 12.755906 187.310562)">公共储能与供需约束</text>
   </g>
   <g id="text_22">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="12.755906" y="206.887613" transform="rotate(-0 12.755906 206.887613)">容量 12000 kWh</text>
   </g>
   <g id="text_23">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="12.755906" y="220.564198" transform="rotate(-0 12.755906 220.564198)">SOC 1200–10800 kWh</text>
   </g>
   <g id="text_24">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="12.755906" y="233.540782" transform="rotate(-0 12.755906 233.540782)">效率 0.9；接口 ≤ 5000 kW</text>
   </g>
   <g id="text_25">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="12.755906" y="246.875492" transform="rotate(-0 12.755906 246.875492)">禁止售电，允许弃光</text>
   </g>
   <g id="text_26">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="12.755906" y="260.190827" transform="rotate(-0 12.755906 260.190827)">逐时段电量平衡</text>
   </g>
   <g id="text_27">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="12.755906" y="273.505536" transform="rotate(-0 12.755906 273.505536)">Q2–Q4 缺口按 5π 外购</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #916323" x="300.472441" y="185.680087" transform="rotate(-0 300.472441 185.680087)">Q4  波动电价：两个策略分别扩展</text>
   </g>
   <g id="text_29">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #267f89" x="165.826772" y="204.169382" transform="rotate(-0 165.826772 204.169382)">Q4-2  沿用 Q2 日前策略</text>
   </g>
   <g id="text_30">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="165.826772" y="220.769592" transform="rotate(-0 165.826772 220.769592)">沿用 α、日末储电量与 ρ</text>
   </g>
   <g id="text_31">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="165.826772" y="236.651393" transform="rotate(-0 165.826772 236.651393)">预测价排计划，实际价结算</text>
   </g>
   <g id="text_32">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #3c6594" x="307.559055" y="204.173921" transform="rotate(-0 307.559055 204.173921)">Q4-3  沿用 Q3 滚动策略</text>
   </g>
   <g id="text_33">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="307.559055" y="221.056467" transform="rotate(-0 307.559055 221.056467)">日内更新负荷 / 光伏</text>
   </g>
   <g id="text_34">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #253d4c" x="307.559055" y="236.647018" transform="rotate(-0 307.559055 236.647018)">决策电价日内不更新</text>
   </g>
   <g id="text_35">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #916323" x="165.826772" y="267.85187" transform="rotate(-0 165.826772 267.85187)">电价预测：历史同刻均值 + 同星期残差均值</text>
   </g>
   <g id="text_36">
    <text style="font-size: 8px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #916323" x="165.826772" y="280.615276" transform="rotate(-0 165.826772 280.615276)">+ 近 7 日残差均值；按当日实际电价结算</text>
   </g>
  </g>
 </g>
